name: Windows, macOS and Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: .venv/bin/python
            browser_flags: --with-deps
          - os: macos-latest
            python: .venv/bin/python
            browser_flags: ''
          - os: windows-2022
            python: .venv/Scripts/python.exe
            browser_flags: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      RUN_PDF_RENDER_TEST: '1'
      VENV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chinese fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          "$VENV_PYTHON" -m pip install -r backend/requirements-dev.txt
      - name: Build frontend
        run: '"$VENV_PYTHON" start-local.py --build-frontend'
      - name: Install Chromium
        run: '"$VENV_PYTHON" start-local.py --install-browser ${{ matrix.browser_flags }}'
      - name: Check runtime dependencies
        run: |
          python - <<'PY'
          import os, subprocess
          result = subprocess.run([os.environ['VENV_PYTHON'], 'start-local.py', '--check'], capture_output=True, text=True, encoding='utf-8')
          print(result.stdout, end='')
          print(result.stderr, end='')
          if result.returncode:
              message = (result.stdout + result.stderr).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Runtime dependency check::' + message)
          raise SystemExit(result.returncode)
          PY
      - name: Run tests (including real FFmpeg and PDF exports)
        run: '"$VENV_PYTHON" -m pytest -q --junitxml="$RUNNER_TEMP/platform-tests.xml"'
      - name: Report failing assertions
        if: failure()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path(os.environ['RUNNER_TEMP']) / 'platform-tests.xml'
          if report.is_file():
              for case in ET.parse(report).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      message = (case.get('name', '') + '\n' + (failure.text or ''))[:16000]
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Platform test failure::' + message)
          PY
